# 문서 사이트(packages/vlossom-docs)를 빌드해 GitHub Pages에 배포한다.
# 저장소 쓰기 권한이 없으므로(contents: read) 버전 커밋, 태그, 릴리스를 만들지 않고, 패키지 배포 단계도 없다.
name: Docs

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        # 수동 실행도 main에서만 동작한다. 다른 브랜치에서 실행하면 build와 deploy를 모두 건너뛴다.
        if: github.ref == 'refs/heads/main'
        timeout-minutes: 10
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # configure-pages는 Pages 설정을 읽기만 한다.
            pages: read
        steps:
            - uses: actions/checkout@v5
            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10
            - uses: actions/setup-node@v5
              with:
                  node-version-file: '.nvmrc'
                  cache: 'pnpm'
                  cache-dependency-path: ./packages/vlossom-docs/pnpm-lock.yaml
            - name: Install dependencies
              working-directory: ./packages/vlossom-docs
              run: pnpm install --frozen-lockfile
            - name: Configure Pages
              id: pages
              uses: actions/configure-pages@v6
            - name: Build docs
              working-directory: ./packages/vlossom-docs
              # Pages 사이트 경로를 base로 쓴다. 커스텀 도메인이 없으면 '/vlossom', 있으면 빈 문자열이다.
              env:
                  BASE_PATH: ${{ steps.pages.outputs.base_path }}
              run: pnpm build --base "$BASE_PATH/"
            - name: Upload artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: packages/vlossom-docs/.vitepress/dist

    deploy:
        needs: build
        # 배포만 한 번에 하나씩 실행한다. main이 아닌 수동 실행은 build에서 끝나므로 이 그룹에 들어오지 않는다.
        concurrency:
            group: pages
            cancel-in-progress: false
        # deploy-pages의 자체 타임아웃(10분)이 먼저 동작해 배포를 취소할 수 있도록 여유를 둔다.
        timeout-minutes: 15
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
