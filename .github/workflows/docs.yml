name: Docs

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        if: github.ref == 'refs/heads/main'
        timeout-minutes: 10
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: read
        steps:
            - uses: actions/checkout@v5
            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10
            - uses: actions/setup-node@v5
              with:
                  node-version-file: '.nvmrc'
                  cache: 'pnpm'
                  cache-dependency-path: |
                      ./packages/vlossom/pnpm-lock.yaml
                      ./packages/vlossom-docs/pnpm-lock.yaml
            # docs는 link:../vlossom으로 저장소의 vlossom dist를 쓰므로, docs보다 먼저 vlossom을 설치하고 빌드한다.
            - name: Install vlossom dependencies
              working-directory: ./packages/vlossom
              run: pnpm install --frozen-lockfile
            - name: Build vlossom
              working-directory: ./packages/vlossom
              run: pnpm build-only
            - name: Install docs dependencies
              working-directory: ./packages/vlossom-docs
              run: pnpm install --frozen-lockfile
            - name: Configure Pages
              id: pages
              uses: actions/configure-pages@v6
            - name: Build docs
              working-directory: ./packages/vlossom-docs
              env:
                  BASE_PATH: ${{ steps.pages.outputs.base_path }}
              run: pnpm build --base "$BASE_PATH/"
            - name: Upload artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: packages/vlossom-docs/.vitepress/dist

    deploy:
        needs: build
        # 워크플로 단위로 걸면 main이 아닌 수동 실행도 그룹에 들어와, 대기 중인 main 배포를 취소할 수 있다.
        concurrency:
            group: pages
            cancel-in-progress: false
        # deploy-pages 자체 타임아웃(10분)보다 길게 두어야 그 타임아웃이 배포를 취소할 수 있다.
        timeout-minutes: 15
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
