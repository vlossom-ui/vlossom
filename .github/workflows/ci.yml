name: CI

on: push

jobs:
    vlossom-lint:
        timeout-minutes: 5
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10
            - uses: actions/setup-node@v5
              with:
                  node-version-file: '.nvmrc'
                  cache: 'pnpm'
                  cache-dependency-path: ./packages/vlossom/pnpm-lock.yaml
            - name: Install dependencies
              working-directory: ./packages/vlossom
              run: pnpm install
            - name: Run eslint
              working-directory: ./packages/vlossom
              run: pnpm lint

    vlossom-build:
        needs: vlossom-lint
        timeout-minutes: 10
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10
            - uses: actions/setup-node@v5
              with:
                  node-version-file: '.nvmrc'
                  cache: 'pnpm'
                  cache-dependency-path: ./packages/vlossom/pnpm-lock.yaml
            - name: Install dependencies
              working-directory: ./packages/vlossom
              run: pnpm install
            - name: Build vlossom
              working-directory: ./packages/vlossom
              run: pnpm build

    vlossom-storybook:
        timeout-minutes: 20
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10
            - uses: actions/setup-node@v5
              with:
                  node-version-file: '.nvmrc'
                  cache: 'pnpm'
                  cache-dependency-path: ./packages/vlossom/pnpm-lock.yaml
            - name: Install dependencies
              working-directory: ./packages/vlossom
              run: pnpm install
            - name: Build Storybook
              working-directory: ./packages/vlossom
              run: pnpm build-storybook --quiet

    vlossom-test:
        timeout-minutes: 20
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10
            - uses: actions/setup-node@v5
              with:
                  node-version-file: '.nvmrc'
                  cache: 'pnpm'
                  cache-dependency-path: ./packages/vlossom/pnpm-lock.yaml
            - name: Install dependencies
              working-directory: ./packages/vlossom
              run: pnpm install
            - name: Run tests
              working-directory: ./packages/vlossom
              run: pnpm test

    vlossom-e2e:
        needs: vlossom-test
        timeout-minutes: 20
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10
            - uses: actions/setup-node@v5
              with:
                  node-version-file: '.nvmrc'
                  cache: 'pnpm'
                  cache-dependency-path: ./packages/vlossom/pnpm-lock.yaml
            - name: Install dependencies
              working-directory: ./packages/vlossom
              run: pnpm install --frozen-lockfile
            - name: Install Playwright browser
              working-directory: ./packages/vlossom
              run: pnpm exec playwright install --with-deps chromium
            - name: Run E2E tests
              working-directory: ./packages/vlossom
              run: pnpm e2e
            - name: Upload Playwright report
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: vlossom-playwright-report
                  path: packages/vlossom/test-results/
                  if-no-files-found: ignore

    vlossom-mcp-test:
        timeout-minutes: 10
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10
            - uses: actions/setup-node@v5
              with:
                  node-version-file: '.nvmrc'
                  cache: 'pnpm'
                  cache-dependency-path: ./packages/vlossom-mcp/pnpm-lock.yaml
            - name: Install dependencies
              working-directory: ./packages/vlossom-mcp
              run: pnpm install --frozen-lockfile
            - name: Run tests
              working-directory: ./packages/vlossom-mcp
              run: pnpm test
